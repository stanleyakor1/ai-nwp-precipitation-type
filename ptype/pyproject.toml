[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ainwp-ptype-original"
version = "0.1.0"
description = "Modular AI-NWP ptype pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "xarray", "metpy", "numba", "netCDF4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ainwp_ptype_original*"]
